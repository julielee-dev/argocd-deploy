apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'git@github.com:julielee-dev/argocd-deploy.git'
    targetRevision: HEAD
    path: 'charts/hello-world'
    helm:
      values: |
        replicaCount: 2
        image:
          tag: staging
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
